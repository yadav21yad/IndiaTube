name: Build IndiaTube APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
         VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
         VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android
      - name: Add IndiaTube App Icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp "IndiaTube Neon Music Icon.webp" android/app/src/main/res/drawable-nodpi/indiatube_icon.png
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/indiatube_icon"|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndiaTube-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
